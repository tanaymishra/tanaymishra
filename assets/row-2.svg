<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img">
  <defs></defs>
  <style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}</style>
  <rect width="880" height="236" fill="#050807"/>
  
  <rect x="0" y="0" width="566" height="236" rx="9" fill="#0a1210" stroke="#17302a" stroke-width="1.2"/>
  <text x="18" y="27" font-size="12.5" fill="#e6edf3" font-weight="600">tanay@github:~$ cat maths.txt</text>
  <rect x="578" y="0" width="302" height="236" rx="9" fill="#0a1210" stroke="#17302a" stroke-width="1.2"/>
  <text x="596" y="27" font-size="12.5" fill="#e6edf3" font-weight="600">Languages</text>
  
  <text x="20" y="64" font-size="12" fill="#a78bfa">&gt; <tspan fill="#4ade80">e^(iπ) + 1 = 0</tspan></text>
  <text x="196" y="64" font-size="11.5" fill="#8b98a5">five constants, one sentence, zero waste</text>
  <text x="20" y="91" font-size="12" fill="#a78bfa">&gt; <tspan fill="#4ade80">O(n log n)</tspan></text>
  <text x="196" y="91" font-size="11.5" fill="#8b98a5">a promise, not a suggestion</text>
  <text x="20" y="118" font-size="12" fill="#a78bfa">&gt; <tspan fill="#4ade80">off-by-one</tspan></text>
  <text x="196" y="118" font-size="11.5" fill="#8b98a5">an induction step I skipped</text>
  <text x="20" y="145" font-size="12" fill="#a78bfa">&gt; <tspan fill="#4ade80">0.1 + 0.2 ≠ 0.3</tspan></text>
  <text x="196" y="145" font-size="11.5" fill="#8b98a5">a lie we all agreed to believe</text>
  <text x="20" y="172" font-size="12" fill="#a78bfa">&gt; <tspan fill="#4ade80">P ≠ NP</tspan></text>
  <text x="196" y="172" font-size="11.5" fill="#8b98a5">probably. my job depends on it.</text>
  <text x="20" y="199" font-size="12" fill="#a78bfa">&gt; <tspan fill="#4ade80">∀ bug ∃ invariant</tspan></text>
  <text x="196" y="199" font-size="11.5" fill="#8b98a5">that I assumed and never proved</text>
  <text x="596" y="66" font-size="10.5" fill="#55636e">across 77 repositories</text>
