<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img">
  <defs></defs>
  <style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}</style>
  <rect width="880" height="240" fill="#070709"/>
  <rect x="0" y="0" width="566" height="240" rx="10" fill="#0d0d12" stroke="#22222e" stroke-width="1.2"/>
  <text x="16" y="26" font-size="12" fill="#4ade80">&#10095; <tspan fill="#e6edf3" font-weight="600">maths.txt</tspan></text>
  <text x="550" y="26" font-size="10" fill="#525b66" text-anchor="end">the universe also refuses to document itself</text>
  <text x="16" y="66" font-size="11" fill="#a78bfa">&#10095; <tspan fill="#4ade80">e^(i&#960;) + 1 = 0</tspan></text>
  <text x="262" y="66" font-size="10" fill="#8b98a5">five constants, one line, zero waste</text>
  <text x="16" y="94" font-size="11" fill="#a78bfa">&#10095; <tspan fill="#4ade80">O(n log n)</tspan></text>
  <text x="262" y="94" font-size="10" fill="#8b98a5">a promise, not a suggestion</text>
  <text x="16" y="122" font-size="11" fill="#a78bfa">&#10095; <tspan fill="#4ade80">0.1 + 0.2 &#8800; 0.3</tspan></text>
  <text x="262" y="122" font-size="10" fill="#8b98a5">a lie we all agreed to believe</text>
  <text x="16" y="150" font-size="11" fill="#a78bfa">&#10095; <tspan fill="#4ade80">P &#8800; NP</tspan></text>
  <text x="262" y="150" font-size="10" fill="#8b98a5">probably. my rent depends on it.</text>
  <text x="16" y="178" font-size="11" fill="#a78bfa">&#10095; <tspan fill="#4ade80">lim sleep(t), t&#8594;deadline = 0</tspan></text>
  <text x="262" y="178" font-size="10" fill="#8b98a5">proven nightly</text>
  <text x="16" y="206" font-size="11" fill="#a78bfa">&#10095; <tspan fill="#4ade80">&#8704; bug &#8707; invariant</tspan></text>
  <text x="262" y="206" font-size="10" fill="#8b98a5">that I assumed and never proved</text><rect x="578" y="0" width="302" height="240" rx="10" fill="#0d0d12" stroke="#22222e" stroke-width="1.2"/>
  <text x="594" y="26" font-size="12" fill="#4ade80">&#10095; <tspan fill="#e6edf3" font-weight="600">disaster_recovery.log</tspan></text>
  
  <g opacity="0">
    <text x="594" y="66" font-size="9.5" fill="#525b66">03:12</text>
    <text x="634" y="66" font-size="9.5" fill="#f472b6">drill: kill the primary db</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.0571;0.0786;0.96;1" values="0;0;1;1;0"/>
  </g>
  <g opacity="0">
    <text x="594" y="92" font-size="9.5" fill="#525b66">03:12</text>
    <text x="634" y="92" font-size="9.5" fill="#e6edf3">replica promoted</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.1071;0.1286;0.96;1" values="0;0;1;1;0"/>
  </g>
  <g opacity="0">
    <text x="594" y="118" font-size="9.5" fill="#525b66">03:13</text>
    <text x="634" y="118" font-size="9.5" fill="#e6edf3">traffic rerouted</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.1571;0.1786;0.96;1" values="0;0;1;1;0"/>
  </g>
  <g opacity="0">
    <text x="594" y="144" font-size="9.5" fill="#525b66">03:14</text>
    <text x="634" y="144" font-size="9.5" fill="#e6edf3">backups verified (again)</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.2071;0.2286;0.96;1" values="0;0;1;1;0"/>
  </g>
  <g opacity="0">
    <text x="594" y="170" font-size="9.5" fill="#525b66">03:15</text>
    <text x="634" y="170" font-size="9.5" fill="#4ade80">users who noticed: 0</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.2571;0.2786;0.96;1" values="0;0;1;1;0"/>
  </g>
  <line x1="594" y1="188" x2="864" y2="188" stroke="#1a1a24"/>
  <text x="594" y="210" font-size="9.5" fill="#8b98a5">the best incident is the one</text>
  <text x="594" y="225" font-size="9.5" fill="#8b98a5">nobody got paged for.</text>
</svg>
